plugins {
    id 'com.android.application'
}

// 发布签名：由环境变量注入（本地签名 / GitHub Actions secrets）。
// 未提供时 release 构建保持未签名，不影响 debug 构建。
def releaseKeystorePath = System.getenv("RINGSERVER_KEYSTORE_FILE")
def releaseKeystorePassword = System.getenv("RINGSERVER_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("RINGSERVER_KEY_ALIAS")
def releaseKeyPassword = System.getenv("RINGSERVER_KEY_PASSWORD")
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.isEmpty() }

android {
    namespace 'com.example.ringserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ringserver"
        // Android 5.0（API 21）起可用
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 轻量级 HTTP 服务器（NanoHTTPD 2.3.1，纯 Java，兼容 API 21）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
