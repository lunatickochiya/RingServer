plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ringserver'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ringserver"
        // Android 5.0（API 21）起可用
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 轻量级 HTTP 服务器（NanoHTTPD 2.3.1，纯 Java，兼容 API 21）
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
